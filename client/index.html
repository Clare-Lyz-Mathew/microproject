<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Universal eSports Tournament & Bracket Management System with real-time MySQL JOIN analytics, offline LAN support, and custom game creation." />
    <title>ESPORTS ARENA | Tournament & Bracket Management System</title>
    <!-- Google Fonts: Inter & Plus Jakarta Sans (Clean Pro eSports UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('esports_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
          if (document.body) document.body.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
